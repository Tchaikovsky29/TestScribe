[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testscribe"
version = "0.1.0"
description = "Run plain-English browser test cases with AI-guided Playwright actions"
requires-python = ">=3.10"
dependencies = [
  "openai>=2,<4",
  "playwright>=1.55,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
testscribe = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
