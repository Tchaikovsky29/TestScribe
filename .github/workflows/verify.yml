name: Verify TestScribe

on:
  push:
    branches: [main, dev]
    tags: ['vscode-v*', 'marketplace-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python package and browser
        run: |
          python -m pip install -e '.[agent]'
          python -m playwright install --with-deps chromium
      - name: Test CLI and MCP integration
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          path: vscode-extension/*.vsix
          archive: false

  release-preview:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: testscribe-*.vsix
          path: dist
          merge-multiple: true
      - name: Publish preview VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --verify-tag --prerelease --title "TestScribe VS Code $GITHUB_REF_NAME" --notes-file .github/release-notes-vscode-preview.md

  publish-marketplace:
    if: startsWith(github.ref, 'refs/tags/marketplace-v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: testscribe-*.vsix
          path: dist
          merge-multiple: true
      - name: Check release tag matches extension version
        run: |
          python3 -c 'import json, os; version = json.load(open("vscode-extension/package.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "marketplace-v" + version'
      - name: Publish verified VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx vsce publish --oidc --packagePath "../dist/testscribe-${GITHUB_REF_NAME#marketplace-v}.vsix"
